version: '3.8'

services:
  db:
    image: postgres:15
    container_name: workspace_postgres
    environment:
      POSTGRES_USER: workspace_user
      POSTGRES_PASSWORD: workspace_password
      POSTGRES_DB: workspace_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
